<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#0891B2" />
  <meta name="description" content="Offline study app for Medical Assistants: flashcards, 3D anatomy, quizzes, calendar, notes, and a BSN/TEAS pathway." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MA Study" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>MA Study — Offline Medical Assistant Study App</title>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="app">
    <!-- App bar -->
    <header class="appbar" role="banner">
      <button class="appbar__back" id="navBack" aria-label="Go back" hidden>‹</button>
      <h1 class="appbar__title" id="appTitle">MA Study</h1>
      <button class="appbar__action" id="navSettings" aria-label="Settings">⚙</button>
    </header>

    <!-- Main scrolling view -->
    <main id="view" class="view" tabindex="-1" role="main" aria-live="polite"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" role="navigation" aria-label="Primary">
      <button class="tabbar__btn" data-route="home" aria-label="Home">
        <span class="tabbar__icon" aria-hidden="true">🏠</span><span class="tabbar__label">Home</span>
      </button>
      <button class="tabbar__btn" data-route="study" aria-label="Study">
        <span class="tabbar__icon" aria-hidden="true">🃏</span><span class="tabbar__label">Study</span>
      </button>
      <button class="tabbar__btn" data-route="anatomy" aria-label="Anatomy 3D">
        <span class="tabbar__icon" aria-hidden="true">🫀</span><span class="tabbar__label">Anatomy</span>
      </button>
      <button class="tabbar__btn" data-route="notes" aria-label="Notes">
        <span class="tabbar__icon" aria-hidden="true">📓</span><span class="tabbar__label">Notes</span>
      </button>
      <button class="tabbar__btn" data-route="more" aria-label="More">
        <span class="tabbar__icon" aria-hidden="true">⋯</span><span class="tabbar__label">More</span>
      </button>
    </nav>
  </div>

  <!-- Bottom sheet (More menu / dialogs) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__scrim" data-close-sheet></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="sheet__grip" data-close-sheet></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Vendored 3D engine (loaded lazily by the anatomy module; tag kept optional) -->
  <!-- Baked, offline study content (no network needed) -->
  <script src="content/data.js"></script>
  <script src="content/library.js"></script>
  <script src="content/decks/anatomy.js"></script>
  <script src="content/decks/med-terminology.js"></script>
  <script src="content/decks/pharmacology.js"></script>
  <script src="content/decks/clinical.js"></script>
  <script src="content/decks/teas.js"></script>
  <script src="content/quizzes/quizbank.js"></script>

  <!-- Core (classic scripts: work over http:// and file://) -->
  <script src="js/store.js"></script>
  <script src="js/modules/util.js"></script>
  <script src="js/modules/flashcards.js"></script>
  <script src="js/modules/quiz.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/notes.js"></script>
  <script src="js/modules/facts.js"></script>
  <script src="js/modules/viewer3d.js"></script>
  <script src="js/modules/library.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
